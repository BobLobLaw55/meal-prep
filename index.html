<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prep Counter</title>
<meta name="description" content="High-protein meal prep recipes, weekly plans and shopping lists for two.">
<meta name="theme-color" content="#F2F6F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161D19" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta property="og:title" content="Prep Counter">
<meta property="og:description" content="High-protein meal prep: 52 recipes, weekly plans, and shopping lists.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <a class="brand" href="#recipes">Prep Counter</a>
    <button class="share-btn" id="shareApp">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Share
    </button>
  </div>
  <nav class="tabs" aria-label="Sections">
    <a href="#recipes" data-tab="recipes">Recipes</a>
    <a href="#week" data-tab="week">Week</a>
    <a href="#list" data-tab="list">Shopping</a>
    <a href="#pantry" data-tab="pantry">Pantry</a>
    <a href="#more" data-tab="more">Settings</a>
  </nav>
</header>

<main id="view" tabindex="-1"></main>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <article class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <button class="sheet-close" data-close aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
    <div id="sheetBody"></div>
  </article>
</div>

<input type="file" id="photoInput" accept="image/*" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
